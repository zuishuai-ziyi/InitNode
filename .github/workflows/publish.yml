name: Publish npm

# 触发：推送 v* tag（与 GitHub Release 同一条 tag）自动发布；
# 也可在 Actions 页面手动运行，默认只做 dry-run（打包校验），不改动线上包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只做 npm publish --dry-run（不真正发布）'
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance：由 OIDC 签名，npm 页面显示「Built and signed on GitHub Actions」

jobs:
  publish:
    name: test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试
        run: npm test

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=v$tag  package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 package.json 的 $ver 不一致，先 bump 版本再打 tag"
            exit 1
          fi

      - name: 打包内容预览
        run: npm pack --dry-run

      - name: 发布
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm publish --provenance --access public
          elif [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "手动触发且勾选 dry-run：只做打包校验"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
